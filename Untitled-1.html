<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= device-width, initial-scale=1.0">
    <title>class chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="chat">
<!-- Header: title + who is sending + clear button-->
<header class="chat-header">
<h1>class chat</h1>
<div class="controls">
<label for="user-select"> send as</label>
<select id="user-select">
    <option value="Ana">Ana</option>
    <option value="Ben">Ben</option>
</select>
<button id="btn" type="button" class="ghost">clear chat</button>
</div>
</header>

<!-- Messages are added here by + send button-->
<ul id="message" class="messages" aria-live="polite"></ul>

<!-- Composer: text box + send bitton-->
<form id="message-form" class="composer" autocomplete="off">
    <label for="message-form" class="visually-hidden">message</label>
    <input id="message-input" type="text" placeholder="Type a massage" maxlength="500" required
    <button type="submit">Send</button>
</form>
