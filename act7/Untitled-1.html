<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial- scale=1.0">
    <title> class chat online </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--screen 1: sign up or login in -->
    <main id="auth screen" class="chat  auth ">
        <h1> class chat </h1>
        <p class="subtitle"> log in to join the conversation. </p>

        <form id="auth-form">
            <label for="display-name"> display-name (sign up only)</label>
            <input id="display-name" type="text" maxlength="24" placeholder="your name or nickname">

            <label for="email"> email </label>
            <input id="email" type="email" required placeholder="you@school.com">

            <label for="password"> password (at least 8 characters)</label>
            <input id="password" type="password" minlength="8" required>

            <div class="auth-buttons">
                <button type="submit" id="login-btn">log in </button>
                <button type="button" id="signup-btn" class="ghost"> sign up </button>
            </div>
        </form>
        <p id="auth-message" class="auth-message" role="status"></p>
    </main>

    <!-- screen 2: the chat room-->
    <main id="chat-screen" class="chat" hidden>
        <header class="chat-header">
            <h1>class chat</h1>
            <div class="controls">
                <span id="who">signed in </span>
                <button id="logout-btn" type="button" class="ghost">log out </button>
            </div>
        </header>

        <ul id="messages" class="composer" aria-live="polite"></ul>

        <form id="messages-form" class="composer" autocomplete="off">
            <label for="messages-input" class="visually-hidden"> messages</label>
            <input id="messages-input" type="text" maxlength="500" required placeholder="Type a message or /weather manila">
            <button type="submit">send</button>
        </form>
    </main>

    <script>
        src = "https://cdn.jsdelivr.net/npm/@supabase-js@2.110.1"
    </script>
    <script src="script.js"></script>
</body>

</html>
